name: JSON Build, API Check & Encoding

on:
  schedule:
    - cron: "0 17 * * *"  # 每天北京时间凌晨1点运行 (UTC 17点)
  push:
    paths:
      - 'LunaTV-config.json'
  workflow_dispatch:
    inputs:
      api_name:
        description: '搜索关键字'
        default: 你好

# 同一时间只允许一个构建，避免和「上游源同步」工作流抢 main
concurrency:
  group: build-check-encode
  cancel-in-progress: false

jobs:
  build-check-encode:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 允许推送

    steps:
      # 1️⃣ 检出仓库
      - uses: actions/checkout@v4

      # 2️⃣ 安装系统依赖 & Node.js
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          # 依赖统一来自 package.json（bs58 + axios），不再临时安装
          npm install --no-audit --no-fund

      # 3️⃣ JSON 处理：生成 jingjian.json
      - name: Generate jingjian.json (strip _comment)
        run: |
          jq '{
            cache_time: .cache_time,
            api_site: (
              .api_site
              | with_entries(select(.value._comment | not))
            )
          }' LunaTV-config.json > jingjian.json

      - name: Validate jingjian.json
        run: jq empty jingjian.json

      # 4️⃣ JSON 处理：生成 jin18.json（去掉 adult）
      - name: Generate jin18.json (strip adult resources)
        run: |
          jq '{
            cache_time: .cache_time,
            api_site: (
              .api_site
              | with_entries(select(.value.name | startswith("🔞") | not))
            )
          }' jingjian.json > jin18.json

      - name: Validate jin18.json
        run: jq empty jin18.json

      # 5️⃣ Base58 编码（直接用仓库里的 encode.js，不再内联生成）
      - name: Encode JSON to Base58
        run: node encode.js

      # 6️⃣ 运行 API 检查脚本
      - name: Run API check
        run: |
          API_NAME="${{ github.event.inputs.api_name || '你好' }}"
          echo "检查 API: $API_NAME"
          node check_api.js "$API_NAME"

      # 7️⃣ 更新 README（API 状态表 + 配置源数量统计）
      # 注意：中转名单 proxy-routes.json 不在 CI 生成。CI 跑在海外机房，
      # 测不出国内 DNS 污染/墙，会把你本机测出来的准确名单覆盖掉。
      # 名单由本机执行 `node probe_routes.js --push` 生成并上传。
      - name: Update report
        run: node update_readme.js

      # 9️⃣ 提交并推送所有生成文件（优化版）
      - name: Commit and push all generated files
        run: |
          # 配置 Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 拉取远程 main 分支，避免冲突
          git fetch origin main
          git reset --soft origin/main

          # 添加所有生成文件
          git add jingjian.json jin18.json LunaTV-config.txt jingjian.txt jin18.txt report.md README.md CORSAPI/README.md

          # 提交更新，如果没有变化则输出提示
          git commit -m "自动更新 JSON、Base58 和 API 报告 ($(date -d '+8 hour' +'%Y-%m-%d %H:%M:%S CST'))" || echo "⚠️ 没有文件变化可提交"

          # 推送到远程 main
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
